<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>월세 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 60px;
      background: #fff;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.07);
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: #22223b;
      margin-bottom: 26px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -1.2px;
    }
    label, .result-label {
      color: #353a48;
      font-size: 1.04rem;
      margin-bottom: 8px;
      display: block;
      font-weight: 400;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px 10px;
      border: 1.5px solid #cdd8df;
      border-radius: 6px;
      font-size: 1.16rem;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 24px;
      text-align: right;
      transition: border 0.2s;
      background: #f7fafc;
    }
    input[type="number"]:focus {
      border-color: #3abff7;
      background: #fff;
    }
    .result {
      background: #f1f6fa;
      border-radius: 8px;
      padding: 18px 14px 14px 14px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    .result-label {
      font-size: 1rem;
      color: #5e647b;
      margin-bottom: 4px;
    }
    .amount {
      font-size: 1.23rem;
      font-weight: 600;
      color: #22223b;
      letter-spacing: -1px;
      text-align: right;
    }
    @media (max-width: 400px) {
      .container { padding: 20px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>월세 계산기</h1>
    <label for="totalRent">월세(원) 입력</label>
    <input type="number" id="totalRent" min="0" placeholder="예: 99000" autocomplete="off">
    <div class="result" id="resultSection" style="display:none;">
      <div class="result-label">공급가액</div>
      <div class="amount" id="supplyAmount">-</div>
      <div class="result-label" style="margin-top:10px;">부가세</div>
      <div class="amount" id="vatAmount">-</div>
    </div>
  </div>
  <script>
    function formatNumber(num) {
      return num.toLocaleString('ko-KR');
    }

    document.getElementById('totalRent').addEventListener('input', function() {
      const input = this.value;
      const val = Number(input.replace(/[^0-9]/g,""));

      if (!val) {
        document.getElementById('resultSection').style.display = 'none';
        return;
      }

      // 공급가액 = 월세 / 1.1 (소수점 아래는 절사)
      const supply = Math.floor(val / 1.1);
      // 부가세 = 월세 - 공급가액
      const vat = val - supply;

      document.getElementById('supplyAmount').textContent = formatNumber(supply) + '원';
      document.getElementById('vatAmount').textContent = formatNumber(vat) + '원';
      document.getElementById('resultSection').style.display = 'block';
    });
  </script>
</body>
  <style>
    body {
      background: #e6f0fa;
    }
    .reset-btn {
      display: block;
      width: 100%;
      margin: 32px auto 0 auto;
      padding: 12px 0;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reset-btn:hover {
      background: #1565c0;
    }
  </style>
  <button class="reset-btn" id="resetBtn">초기화</button>
  <script>
    // ... (기존 script 위에 붙일 수 있음)
    document.getElementById('resetBtn').onclick = function() {
      document.getElementById('totalRent').value = '';
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('supplyAmount').textContent = '-';
      document.getElementById('vatAmount').textContent = '-';
      document.getElementById('totalRent').focus();
    }
  </script>
</html>
